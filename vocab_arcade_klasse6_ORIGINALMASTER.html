<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOCAB ARCADE</title>
<style>
:root{--bg:#090b17;--panel:#14182b;--panel2:#1c2240;--ink:#f8f8ff;--muted:#aeb6d9;--pink:#ff4fd8;--cyan:#4de8ff;--lime:#b8ff5a;--yellow:#ffd84d;--red:#ff6179;--violet:#8c72ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 15% 0,#2a174c 0,transparent 34%),radial-gradient(circle at 90% 15%,#073b50 0,transparent 30%),var(--bg);color:var(--ink)}
button,input{font:inherit}.app{max-width:1100px;margin:auto;padding:18px 18px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(#090b17e8,#090b1700)}
.logo{font-weight:1000;letter-spacing:.12em}.chip,.btn{border:1px solid #39405f;background:#202641;color:#fff;border-radius:15px;padding:11px 14px;font-weight:900}.btn{cursor:pointer}.btn:active,.card:active{transform:scale(.98)}
.hero{padding:28px 0 8px}.hero h1{font-size:clamp(48px,10vw,100px);line-height:.83;margin:12px 0;font-weight:1000;letter-spacing:-.055em}.hero h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 28px #4de8ff55}.sub{color:var(--muted);font-size:18px}
.progress{height:12px;border-radius:20px;background:#252b46;overflow:hidden;margin-top:16px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:20px}
.sectiontitle{margin:28px 0 12px;font-size:13px;letter-spacing:.15em;color:#cbd1ec;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;overflow:hidden;min-height:165px;padding:20px;border:1px solid #343b5b;border-radius:25px;background:linear-gradient(145deg,#1d2340,#111525);color:#fff;text-align:left;cursor:pointer;box-shadow:0 16px 50px #0004}.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-65px;background:var(--glow,#4de8ff);filter:blur(45px);opacity:.18}.ico{font-size:38px}.card b{display:block;font-size:25px;margin-top:10px}.card span{display:block;color:var(--muted);margin-top:7px}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1f;font-size:11px;font-weight:1000;letter-spacing:.08em}
.panel{margin-top:16px;padding:22px;border:1px solid #343b5b;border-radius:26px;background:#12172aee;box-shadow:0 18px 55px #0005}.question{text-align:center;font-size:clamp(28px,6vw,52px);font-weight:1000;margin:28px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{padding:18px;border:1px solid #3b4365;border-radius:17px;background:#202744;color:#fff;font-weight:900;min-height:70px}.answer:hover{border-color:var(--cyan)}
.feedback{text-align:center;min-height:38px;margin:16px;font-size:20px;font-weight:1000}.good{color:var(--lime)}.bad{color:var(--red)}.input{width:100%;padding:18px;border:1px solid #3b4365;border-radius:17px;background:#0d1120;color:white;text-align:center;font-size:23px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.key{width:44px;height:44px;border:0;border-radius:10px;background:#303957;color:white;font-weight:1000}.slots{text-align:center;font-size:28px;letter-spacing:.13em;font-weight:1000;margin:20px;word-break:break-word}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mem{min-height:88px;padding:7px;border:1px solid #3b4365;border-radius:14px;background:#242c4b;color:white;font-weight:850}.hidden{font-size:0}.hidden:after{content:"★";font-size:25px;color:var(--cyan)}.matched{background:#194739;border-color:#4fe0a0}
.score{font-size:72px;text-align:center;font-weight:1000}.combo{text-align:center;color:var(--yellow);font-weight:1000;min-height:24px}
.arena{position:relative;height:430px;border-radius:24px;overflow:hidden;background:linear-gradient(#101a36,#11162a 60%,#171d35);border:1px solid #3a4264;touch-action:none}.target{position:absolute;padding:12px 15px;border-radius:16px;background:#293353;border:2px solid #56648e;color:#fff;font-weight:1000;box-shadow:0 8px 22px #0006;user-select:none}.ship{position:absolute;bottom:12px;font-size:48px;transform:translateX(-50%);user-select:none}.basket{position:absolute;bottom:8px;width:92px;height:34px;border:4px solid var(--yellow);border-top:0;border-radius:0 0 25px 25px;transform:translateX(-50%)}.fall{position:absolute;padding:10px 13px;border-radius:14px;background:#293353;border:2px solid #59678e;font-weight:900;white-space:nowrap}
.hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:1000}.sentence{font-size:clamp(23px,5vw,38px);line-height:1.35;text-align:center;font-weight:850;margin:25px auto;max-width:850px}.blank{color:var(--cyan);border-bottom:3px solid var(--cyan);padding:0 8px}
.scramble{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px}.piece{padding:12px 14px;border-radius:14px;border:1px solid #485174;background:#262e4e;color:white;font-weight:850}.build{min-height:75px;padding:12px;border:2px dashed #455071;border-radius:17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#0e1324;border:1px solid #303856;border-radius:18px;padding:14px}.row{padding:7px 0;border-bottom:1px solid #29304a;font-size:13px}.row:last-child{border:0}.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:15px}.tab.on{border-color:var(--cyan);color:var(--cyan)}
.flash{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.05)}}@media(max-width:680px){.grid,.answers,.cols{grid-template-columns:1fr}.memory{grid-template-columns:repeat(4,1fr)}.mem{font-size:11px;min-height:72px}.arena{height:390px}.app{padding:12px}.hero h1{font-size:58px}}
</style></head>
<body><main class="app" id="app"></main>
<script>
const V=[["mountain","Berg","e"],["lake","(Binnen-)See","e"],["warm","warm","e"],["hot","heiß","e"],["cold","kalt","e"],["sunny","sonnig","e"],["sun","Sonne","e"],["rain","Regen","e"],["beautiful","schön","e"],["tomorrow","morgen","e"],["funny","witzig; komisch","e"],["yesterday","gestern","e"],["class","Unterricht; Kurs","e"],["alone","allein","e"],["long","lang","e"],["short","kurz","e"],["Christmas","Weihnachten","e"],["healthy","gesund","e"],["yummy","lecker","e"],["trip","Ausflug; Reise","e"],["project","Projekt","e"],["better","besser","e"],["circle","Kreis","e"],["rule","Regel","e"],["sentence","Satz","e"],["barbecue","Grillfest; Grillparty","m"],["walk around","umhergehen; herumlaufen","m"],["weather","Wetter","m"],["rainy","regnerisch","m"],["these","die; diese (hier)","m"],["give","geben","m"],["stay: I stayed","bleiben: ich blieb / ich bin geblieben","m"],["poor Ellie","(die) arme Ellie","m"],["chain","Kette","m"],["its name","sein Name / ihr Name","m"],["quite","ziemlich","m"],["at break","in der Pause (zwischen Schulstunden)","m"],["newsletter","Mitteilungsblatt; Informationsblatt","m"],["lunchtime","Mittagszeit","m"],["unfit","nicht fit","m"],["experiment","Experiment; Versuch","m"],["act","Theater spielen; schauspielern","m"],["play","Theaterstück","m"],["Which club?","Welcher Klub?","m"],["more ideas","mehr Ideen; weitere Ideen","m"],["so","also; deshalb; daher","m"],["channel","Kanal","m"],["drive","(mit dem Auto) fahren","m"],["make friends","Freunde finden","m"],["present","Gegenwart","m"],["past","Vergangenheit","m"],["look for","suchen","m"],["they weren't …","sie waren nicht …","h"],["go: I went","gehen: ich ging / ich bin gegangen","h"],["read: I read","lesen: ich las / ich habe gelesen","h"],["have to do sth.","etwas tun müssen","h"],["I'd like to go home.","Ich würde gern nach Hause gehen.","h"],["meet: I met","treffen: ich traf / ich habe getroffen","h"],["we didn't have a …","wir hatten kein / keine …","h"],["get: I got","bekommen: ich bekam / ich habe bekommen","h"],["get fit/hot/…","fit/heiß/… werden","h"],["do: I did","machen/tun: ich machte/tat / ich habe gemacht/getan","h"],["find sth. out","etwas herausfinden","h"],["put sth. in","etwas einsetzen; eingeben","h"],["be/feel homesick","Heimweh haben","h"]];
const SENT=[["Yesterday I was home late. Mum wasn't happy.","Yesterday","yesterday"],["I always read in bed.","read","read: I read"],["Look, it's late. We have to go now.","have to","have to do sth."],["I'd like to go to the park. What would you like to do?","I'd like","I'd like to go home."],["At break it's always quite noisy at school.","At break","at break"],["Yesterday I got a long letter from grandma.","long","long"],["It's getting very hot in here. Can you open a window, please?","getting","get fit/hot/…"],["Get fit and healthy – join our football club.","healthy","healthy"],["Which club would you like to join?","Which club","Which club?"],["Put in your name and address.","Put in","put sth. in"],["It was too hot in the garden, so we went inside.","so","so"],["Does your father drive to work?","drive","drive"],["I'm looking for Adrian. Where is he?","looking for","look for"]];
const A=document.getElementById("app"); let VS={},SS={}; try{VS=JSON.parse(localStorage.vocabArcadeV||"{}");SS=JSON.parse(localStorage.vocabArcadeS||"{}")}catch(e){}
function save(){try{localStorage.vocabArcadeV=JSON.stringify(VS);localStorage.vocabArcadeS=JSON.stringify(SS)}catch(e){}}
function sh(a){let b=[...a];for(let i=b.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function mix(n=10,p=V){let e=sh(p.filter(x=>x[2]=="e")).slice(0,4),m=sh(p.filter(x=>x[2]=="m")).slice(0,4),h=sh(p.filter(x=>x[2]=="h")).slice(0,2);let z=[...e,...m,...h];if(z.length<n)z=z.concat(sh(p.filter(x=>!z.includes(x))).slice(0,n-z.length));return sh(z)}
function recV(k,ok,w){VS[k]??={r:0,x:0,p:0};VS[k][ok?"r":"x"]++;VS[k].p+=ok?w:-w;save()}function recS(k,ok,w){SS[k]??={r:0,x:0,p:0};SS[k][ok?"r":"x"]++;SS[k].p+=ok?w:-w;save()}
function lvl(s){if(!s||s.r+s.x<2)return"practice";let r=s.r/(s.r+s.x);if(s.p>=4&&r>=.75)return"safe";if(s.x>=2&&r<.55)return"hard";return"practice"}
function head(t,p=""){return `<div class=top><button class=btn onclick="stopGame();menu()">⌂ MENU</button><b>${t}</b><span class=chip>${p}</span></div>`}
function menu(){stopGame();let safe=V.filter(x=>lvl(VS[x[0]])=="safe").length;A.innerHTML=`<div class=top><div class=logo>VOCAB ARCADE</div><span class=chip>⭐ ${safe}/65 MASTERED</span></div><section class=hero><h1>PLAY.<br><em>LEVEL UP.</em></h1><div class=sub>8 Games. Vocabulary + sentences. Beat your score.</div><div class=progress><i style="width:${safe/65*100}%"></i></div></section>
<div class=sectiontitle>VOCAB GAMES</div><div class=grid>
${card("⚡","PICK IT!","Choose the right English word.","EASY","#b8ff5a","pickStart()")}
${card("⌨️","TYPE IT!","Type the English answer yourself.","CHALLENGE","#ff4fd8","typeStart()")}
${card("🛟","WORD RESCUE","Save the word letter by letter.","SPELL","#4de8ff","rescueStart()")}
${card("🧠","MEMORY","Match German and English.","MATCH","#8c72ff","memoryStart()")}
</div><div class=sectiontitle>ACTION GAMES</div><div class=grid>
${card("🚀","WORD BLASTER","Blast the correct English word.","ACTION","#ff6179","blasterStart()")}
${card("🧺","CATCH IT!","Catch the right word. Dodge the rest.","ACTION","#ffd84d","catchStart()")}
</div><div class=sectiontitle>SENTENCE GAMES</div><div class=grid>
${card("🎯","SENTENCE CHALLENGE","Choose the missing learning word.","CONTEXT","#4de8ff","sentenceStart()")}
${card("🔀","SENTENCE SCRAMBLE","Put the original sentence back together.","BUILD","#ff4fd8","scrambleStart()")}
</div><div class=sectiontitle>YOUR TRAINING</div><div class=grid>
${card("📊","MY PROGRESS","Vocabulary and sentences separately.","STATS","#b8ff5a","report()")}
${card("🎯","TRAIN HARD WORDS","Focus on words not mastered yet.","FOCUS","#ffd84d","weak()")}
</div>`}
function card(i,t,s,b,g,fn){return `<button class=card style="--glow:${g}" onclick="${fn}"><div class=ico>${i}</div><b>${t}</b><span>${s}</span><small class=badge>${b}</small></button>`}
let R=[],q=0,score=0,combo=0,timer=null,raf=null;
function stopGame(){if(timer)clearInterval(timer);timer=null;if(raf)cancelAnimationFrame(raf);raf=null}
function pickStart(p=V){R=mix(10,p);q=score=combo=0;pickQ()}function pickQ(){if(q>=R.length)return end("PICK IT!",score,R.length);let[e,d]=R[q],opts=sh([e,...sh(V.filter(x=>x[0]!=e)).slice(0,3).map(x=>x[0])]);A.innerHTML=head("⚡ PICK IT!",`${q+1}/10`)+`<div class=panel><div class=question>${d}</div><div class=answers>${opts.map(x=>`<button class=answer onclick='pickAns(${JSON.stringify(x)},${JSON.stringify(e)})'>${x}</button>`).join("")}</div><div id=fb class=feedback></div></div>`}
function pickAns(x,e){let ok=x==e;recV(e,ok,1);if(ok){score++;combo++}else combo=0;document.querySelectorAll(".answer").forEach(b=>b.disabled=1);fb(ok,e);setTimeout(()=>{q++;pickQ()},800)}
function typeStart(p=V){R=mix(10,p);q=score=combo=0;typeQ()}function typeQ(){if(q>=R.length)return end("TYPE IT!",score,R.length);let[e,d]=R[q];A.innerHTML=head("⌨️ TYPE IT!",`${q+1}/10`)+`<div class=panel><div class=question>${d}</div><input id=inp class=input autocorrect=off autocapitalize=off spellcheck=false placeholder="English …"><div class=actions><button class=btn onclick=typeCheck()>CHECK ✓</button></div><div id=fb class=feedback></div></div>`;inp.focus();inp.onkeydown=e=>{if(e.key=="Enter")typeCheck()}}
function norm(x){return x.trim().toLowerCase().replace(/[’]/g,"'").replace(/[.…]+$/g,"").replace(/\s+/g," ")}
function valid(expected,x){let a=norm(x),e=norm(expected);if(e=="pick sb. up")return ["pick sb. up","pick sb up","pick somebody up"].includes(a);if(e=="i'd prefer")return ["i'd prefer","i would prefer"].includes(a);if(e=="not anywhere")return ["not anywhere","anywhere"].includes(a);return a==e}
function typeCheck(){let e=R[q][0],ok=valid(e,inp.value);recV(e,ok,2);if(ok){score++;combo++}else combo=0;inp.disabled=1;fb(ok,e);setTimeout(()=>{q++;typeQ()},950)}
function fb(ok,e){document.getElementById("fb").innerHTML=ok?`<span class=good>PERFECT! +100 ${combo>1?"· "+combo+"× COMBO":""}</span>`:`<span class=bad>NOT YET · ${e}</span>`}
let target="",used=[],miss=0;function rescueStart(){R=mix(8,V.filter(x=>/^[a-zA-Z ]+$/.test(x[0])));q=score=0;rescueQ()}function rescueQ(){if(q>=R.length)return end("WORD RESCUE",score,R.length);target=R[q][0];used=[];miss=0;drawRescue()}
function drawRescue(){let sl=[...target].map(c=>c==" "?"&nbsp;&nbsp;":used.includes(c.toLowerCase())?c:"_").join(" ");A.innerHTML=head("🛟 WORD RESCUE",`${q+1}/${R.length}`)+`<div class=panel><div class=question>${R[q][1]}</div><div class=slots>${sl}</div><div class=feedback>${"❤️".repeat(Math.max(0,6-miss))}</div><div class=keys>${"abcdefghijklmnopqrstuvwxyz".split("").map(l=>`<button class=key ${used.includes(l)?"disabled":""} onclick="guess('${l}')">${l.toUpperCase()}</button>`).join("")}</div></div>`}
function guess(l){if(used.includes(l))return;used.push(l);if(!target.toLowerCase().includes(l))miss++;let win=[...target.toLowerCase()].filter(c=>/[a-z]/.test(c)).every(c=>used.includes(c));if(win||miss>=6){recV(target,win,1);if(win)score++;setTimeout(()=>{alert(win?"SAVED! "+target:"Solution: "+target);q++;rescueQ()},80)}else drawRescue()}
let M=[],first=null,lock=false,matched=0;function memoryStart(){let p=mix(8);M=sh(p.flatMap(([e,d],k)=>[{x:e,k,e},{x:d,k,e}]));first=null;lock=false;matched=0;memoryDraw()}function memoryDraw(){A.innerHTML=head("🧠 MEMORY",`${matched}/8`)+`<div class=panel><div class=memory>${M.map((c,i)=>`<button id=m${i} class="mem hidden" onclick=flip(${i})>${c.x}</button>`).join("")}</div></div>`}
function flip(i){if(lock)return;let b=document.getElementById("m"+i);if(!b.classList.contains("hidden"))return;b.classList.remove("hidden");if(first===null){first=i;return}if(M[first].k==M[i].k){b.classList.add("matched");document.getElementById("m"+first).classList.add("matched");recV(M[i].e,true,.75);matched++;first=null;if(matched==8)setTimeout(()=>end("MEMORY",8,8),400)}else{lock=true;recV(M[i].e,false,.25);let z=first;setTimeout(()=>{document.getElementById("m"+z)?.classList.add("hidden");document.getElementById("m"+i)?.classList.add("hidden");first=null;lock=false},600)}}
let actionWord=null,actionTargets=[];function blasterStart(){stopGame();R=mix(10);q=score=combo=0;blasterRound()}function blasterRound(){if(q>=R.length)return end("WORD BLASTER",score,R.length);actionWord=R[q];let opts=sh([actionWord[0],...sh(V.filter(x=>x[0]!=actionWord[0])).slice(0,4).map(x=>x[0])]);A.innerHTML=head("🚀 WORD BLASTER",`${q+1}/10`)+`<div class=hud><span>🎯 ${actionWord[1]}</span><span>⭐ ${score} · ${combo}×</span></div><div id=arena class=arena><div class=ship style="left:50%">🚀</div></div>`;let ar=document.getElementById("arena");opts.forEach((x,k)=>{let b=document.createElement("button");b.className="target";b.textContent=x;b.style.left=(5+Math.random()*68)+"%";b.style.top=(15+k*65)+"px";b.onclick=()=>blast(x,b);ar.appendChild(b)});timer=setTimeout(()=>{recV(actionWord[0],false,.5);combo=0;q++;blasterRound()},6500)}
function blast(x,b){clearTimeout(timer);let ok=x==actionWord[0];recV(actionWord[0],ok,.75);if(ok){score++;combo++;b.textContent="💥 +100";b.classList.add("flash")}else{combo=0;b.textContent="✕";b.classList.add("flash")}setTimeout(()=>{q++;blasterRound()},500)}
let drops=[],basketX=50,lastT=0;function catchStart(){stopGame();R=mix(8);q=score=combo=0;catchRound()}function catchRound(){if(q>=R.length)return end("CATCH IT!",score,R.length);actionWord=R[q];A.innerHTML=head("🧺 CATCH IT!",`${q+1}/${R.length}`)+`<div class=hud><span>🎯 Catch: ${actionWord[1]}</span><span>⭐ ${score}</span></div><div id=arena class=arena><div id=basket class=basket style="left:50%"></div></div>`;let ar=document.getElementById("arena");basketX=50;ar.onpointermove=e=>{let r=ar.getBoundingClientRect();basketX=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100));basket.style.left=basketX+"%"};let opts=sh([actionWord[0],...sh(V.filter(x=>x[0]!=actionWord[0])).slice(0,3).map(x=>x[0])]);drops=opts.map((x,k)=>({x,px:8+k*23,y:-k*85,el:null}));drops.forEach(d=>{let e=document.createElement("div");e.className="fall";e.textContent=d.x;e.style.left=d.px+"%";ar.appendChild(e);d.el=e});lastT=performance.now();raf=requestAnimationFrame(catchLoop)}
function catchLoop(t){let dt=(t-lastT)/16;lastT=t;let ar=document.getElementById("arena");if(!ar)return;for(let d of drops){d.y+=2.0*dt;d.el.style.top=d.y+"px";if(d.y>ar.clientHeight-62&&!d.done){d.done=true;let hit=Math.abs(d.px-basketX)<15;if(hit){let ok=d.x==actionWord[0];recV(actionWord[0],ok,.75);if(ok){score++;combo++;cancelAnimationFrame(raf);return setTimeout(()=>{q++;catchRound()},350)}else combo=0}}}let correct=drops.find(d=>d.x==actionWord[0]);if(correct&&correct.y>ar.clientHeight+10){recV(actionWord[0],false,.5);cancelAnimationFrame(raf);return setTimeout(()=>{q++;catchRound()},300)}raf=requestAnimationFrame(catchLoop)}
let SR=[];function sentenceStart(){SR=sh(SENT).slice(0,10);q=score=0;sentenceQ()}function sentenceQ(){if(q>=SR.length)return end("SENTENCE CHALLENGE",score,SR.length,true);let[s,w,key]=SR[q],blank=s.replace(w,`<span class=blank>________</span>`);let pool=sh([...new Set(SENT.filter(x=>x[2]!=key).map(x=>x[1]))]).slice(0,3),opts=sh([w,...pool]);A.innerHTML=head("🎯 SENTENCE CHALLENGE",`${q+1}/10`)+`<div class=panel><div class=sentence>${blank}</div><div class=answers>${opts.map(x=>`<button class=answer onclick='sentAns(${JSON.stringify(x)},${JSON.stringify(w)},${JSON.stringify(s)})'>${x}</button>`).join("")}</div><div id=fb class=feedback></div></div>`}
function sentAns(x,w,s){let ok=x==w;recS(s+"|"+w,ok,1);if(ok)score++;document.querySelectorAll(".answer").forEach(b=>b.disabled=1);document.getElementById("fb").innerHTML=ok?`<span class=good>NICE! Sentence solved.</span>`:`<span class=bad>Correct: ${w}</span>`;setTimeout(()=>{q++;sentenceQ()},850)}
let pieces=[],built=[];function scrambleStart(){SR=sh(SENT).slice(0,8);q=score=0;scrambleQ()}function tokenize(s){return s.match(/[^.!?]+[.!?]?/g)?.flatMap(chunk=>{let a=chunk.trim().split(/\s+/);let out=[];for(let i=0;i<a.length;i+=2)out.push(a.slice(i,i+2).join(" "));return out})||[s]}
function scrambleQ(){if(q>=SR.length)return end("SENTENCE SCRAMBLE",score,SR.length,true);let[s,w]=SR[q];pieces=tokenize(s);built=[];let mixed=sh(pieces);A.innerHTML=head("🔀 SENTENCE SCRAMBLE",`${q+1}/${SR.length}`)+`<div class=panel><div class=muted style="text-align:center">Build the original sentence.</div><div id=build class=build></div><div id=pool class=scramble>${mixed.map((x,i)=>`<button class=piece onclick='addPiece(this,${JSON.stringify(x)})'>${x}</button>`).join("")}</div><div class=actions><button class=btn onclick=checkScramble()>CHECK ✓</button><button class=btn onclick=scrambleQ()>↻ RESET</button></div><div id=fb class=feedback></div></div>`}
function addPiece(el,x){built.push(x);let b=document.createElement("button");b.className="piece";b.textContent=x;b.onclick=()=>{let n=[...build.children].indexOf(b);built.splice(n,1);b.remove();el.style.display=""};build.appendChild(b);el.style.display="none"}
function checkScramble(){let s=SR[q][0],w=SR[q][1],ok=built.join(" ")==pieces.join(" ");recS(s+"|"+w,ok,1.5);if(ok){score++;document.getElementById("fb").innerHTML=`<span class=good>PERFECT! ${s.replace(w,"<u>"+w+"</u>")}</span>`;setTimeout(()=>{q++;scrambleQ()},900)}else document.getElementById("fb").innerHTML=`<span class=bad>Not quite. Try again!</span>`}
function end(n,s,t,isS=false){stopGame();A.innerHTML=head(n,"FINISH")+`<div class=panel><div class=score>${s}/${t}</div><div class=combo>${s==t?"🏆 PERFECT RUN!":s>=t*.7?"🔥 NICE RUN!":"🎮 TRY ANOTHER ROUND!"}</div><div class=actions><button class=btn onclick=menu()>⌂ MENU</button><button class=btn onclick=report()>📊 MY PROGRESS</button></div></div>`}
function report(){stopGame();let vg={safe:[],practice:[],hard:[]};V.forEach(x=>vg[lvl(VS[x[0]])].push(x));let sg={safe:[],practice:[],hard:[]};SENT.forEach(x=>sg[lvl(SS[x[0]+"|"+x[1]])].push(x));A.innerHTML=head("📊 MY PROGRESS","")+`<div class=panel><h2>VOCABULARY · 65 WORDS</h2>${stat(vg,x=>`<b>${x[0]}</b><br><span class=muted>${x[1]}</span>`)}<h2 style="margin-top:30px">SENTENCES · ${SENT.length} LEARNING TARGETS</h2>${stat(sg,x=>`<b>${x[0].replace(x[1],"<u>"+x[1]+"</u>")}</b>`)}<div class=actions><button class=btn onclick=weak()>🎯 TRAIN HARD WORDS</button><button class=btn onclick=resetAll()>RESET PROGRESS</button></div></div>`}
function stat(g,render){let box=(k,t,e)=>`<div class=box><h3>${e} ${t} · ${g[k].length}</h3>${g[k].length?g[k].map(x=>`<div class=row>${render(x)}</div>`).join(""):`<span class=muted>None yet.</span>`}</div>`;return `<div class=cols>${box("safe","SAFE","🟢")}${box("practice","PRACTISE","🟡")}${box("hard","HARD","🔴")}</div>`}
function weak(){let p=V.filter(x=>lvl(VS[x[0]])!="safe");typeStart(p.length>=10?p:V)}function resetAll(){if(confirm("Reset all learning progress?")){VS={};SS={};save();report()}}
menu();
</script></body></html>
