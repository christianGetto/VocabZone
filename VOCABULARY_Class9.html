function norm(x){return x.trim().toLowerCase().replace(/[’´`]/g,"'").replace(/[.…]+$/g,"").replace(/\s+/g," ")}
function valid(expected,x){
 let a=norm(x),e=norm(expected);
 const variants={
  "stay: i stayed":["stay","i stayed","stayed"],
  "go: i went":["go","i went","went"],
  "read: i read":["read","i read"],
  "meet: i met":["meet","i met","met"],
  "get: i got":["get","i got","got"],
  "do: i did":["do","i did","did"],
  "have to do sth.":["have to do sth.","have to do sth","have to do something"],
  "find sth. out":["find sth. out","find sth out","find something out"],
  "put sth. in":["put sth. in","put sth in","put something in"],
  "be/feel homesick":["be homesick","feel homesick"],

  "we didn't have a …":["we didn't have a","we did not have a"],
  "i'd like to go home.":["i'd like to go home","i would like to go home"]
 };
 if(variants[e])return variants[e].map(norm).includes(a);
 return a==e
}

let M=[],first=null,lock=false,matched=0;function memoryStart(){let p=mix(8);M=sh(p.flatMap(([e,d],k)=>[{x:e,k,e},{x:d,k,e}]));first=null;lock=false;matched=0;memoryDraw()}function memoryDraw(){A.innerHTML=head("🧠 MEMORY",`${matched}/${M.length/2}`)+`<div class=panel><div class=memory>${M.map((c,i)=>`<button id=m${i} class="mem hidden" onclick=flip(${i})>${c.x}</button>`).join("")}</div></div>`}
function flip(i){if(lock)return;let b=document.getElementById("m"+i);if(!b.classList.contains("hidden"))return;b.classList.remove("hidden");if(first===null){first=i;return}if(M[first].k==M[i].k){b.classList.add("matched");document.getElementById("m"+first).classList.add("matched");recV(M[i].e,true,.75);matched++;first=null;if(matched===M.length/2)later(()=>end("MEMORY",8,8),400)}else{lock=true;recV(M[i].e,false,.25);let z=first;later(()=>{document.getElementById("m"+z)?.classList.add("hidden");document.getElementById("m"+i)?.classList.add("hidden");first=null;lock=false},600)}}
let actionWord=null,actionTargets=[];function blasterStart(){stopGame();R=mix(10);q=score=combo=0;blasterRound()}function blasterRound(){if(q>=R.length)return end("WORD BLASTER",score,R.length);actionWord=R[q];let opts=sh([actionWord[0],...sh(V.filter(x=>x[0]!=actionWord[0])).slice(0,4).map(x=>x[0])]);A.innerHTML=head("🚀 WORD BLASTER",`${q+1}/10`)+`<div class=hud><span>🎯 ${actionWord[1]}</span><span>⭐ ${score} · ${combo}×</span></div><div id=arena class=arena><div class=ship style="left:50%">🚀</div></div>`;let ar=document.getElementById("arena");opts.forEach((x,k)=>{let b=document.createElement("button");b.className="target";b.textContent=x;b.style.left=(5+Math.random()*68)+"%";b.style.top=(15+k*65)+"px";b.onclick=()=>blast(x,b);ar.appendChild(b)});timer=later(()=>{recV(actionWord[0],false,.5);combo=0;q++;blasterRound()},6500)}

let drops=[],basketX=50,lastT=0;function catchStart(){stopGame();R=mix(8);q=score=combo=0;catchRound()}function catchRound(){if(q>=R.length)return end("CATCH IT!",score,R.length);actionWord=R[q];A.innerHTML=head("🪣 CATCH IT!",`${q+1}/${R.length}`)+`<div class=hud><span>🎯 Gesucht: ${actionWord[1]}</span><span>⭐ ${score}</span></div><div id=arena class=arena><div id=basket class=basket style="left:50%"></div></div>`;let ar=document.getElementById("arena");basketX=50;ar.onpointermove=e=>{let r=ar.getBoundingClientRect();basketX=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100));basket.style.left=basketX+"%"};let opts=sh([actionWord[0],...sh(V.filter(x=>x[0]!=actionWord[0])).slice(0,3).map(x=>x[0])]);let lanes=sh([12,36,60,84]);drops=opts.map((x,k)=>({x,px:lanes[k],y:-42,el:null,done:false}));drops.forEach(d=>{let e=document.createElement("div");e.className="fall";e.textContent=d.x;e.style.left=d.px+"%";e.style.top=d.y+"px";ar.appendChild(e);d.el=e});lastT=performance.now();raf=requestAnimationFrame(catchLoop)}
function catchLoop(t){let dt=Math.min(2.5,(t-lastT)/16);lastT=t;let ar=document.getElementById("arena");if(!ar)return;let bottom=ar.clientHeight-62;for(let d of drops){if(d.done)continue;d.y+=1.65*dt;d.el.style.top=d.y+"px";if(d.y>=bottom){let hit=Math.abs(d.px-basketX)<15;d.done=true;if(hit){let ok=d.x==actionWord[0];if(ok){recV(actionWord[0],true,.75);score++;combo++;cancelAnimationFrame(raf);return later(()=>{q++;catchRound()},350)}else{combo=0;d.el.style.opacity=".25"}}else{d.el.style.opacity=".18"}}}let correct=drops.find(d=>d.x==actionWord[0]);if(correct&&correct.done){recV(actionWord[0],false,.5);cancelAnimationFrame(raf);return later(()=>{q++;catchRound()},300)}raf=requestAnimationFrame(catchLoop)}

let snake=null,pac=null;

function snakeStart(){
 stopGame();
 let round=sh(V).slice(0,10);
 snake={round,idx:0,score:0,lives:3,head:{x:4,y:2},body:[{x:3,y:2},{x:2,y:2}],dir:{x:1,y:0},items:[],paused:true};

}
function snakeLoad(){
 if(!snake||snake.lives<=0)return snakeEnd();
 if(snake.idx>=snake.round.length)snake.round=sh(V).slice(0,10),snake.idx=0;
 let x=snake.round[snake.idx], wrong=sh(V.filter(v=>v[0]!==x[0])).slice(0,3);
 let opts=sh([{t:x[0],good:true},...wrong.map(v=>({t:v[0],good:false}))]);
 let occupied=new Set([snake.head.x+","+snake.head.y,...snake.body.map(z=>z.x+","+z.y)]);
 let reserved=new Set(occupied), placed=[];
 // Freiraum um den Kopf: falsche Wörter dürfen die Schlange nicht einkesseln.
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   let xx=snake.head.x+dx,yy=snake.head.y+dy;if(xx>=0&&xx<9&&yy>=0&&yy<5)reserved.add(xx+","+yy);
 }
 // Zusätzlich bleibt eine komplette Fluchtgasse in Blickrichtung frei.
 for(let k=1;k<9;k++){
   let xx=snake.head.x+snake.dir.x*k,yy=snake.head.y+snake.dir.y*k;
   if(xx<0||xx>=9||yy<0||yy>=5)break;reserved.add(xx+","+yy);
 }
 for(const o of opts){
   let cells=Math.max(1,Math.min(4,Math.ceil(o.t.length/6))), candidates=[];
   for(let y=0;y<5;y++)for(let xx=0;xx<=9-cells;xx++){
     let ok=true;for(let c=0;c<cells;c++)if(reserved.has((xx+c)+","+y))ok=false;
     if(ok)candidates.push({x:xx,y,cells});
   }
   let spot=sh(candidates)[0];
   if(!spot)continue;
   placed.push({...o,...spot});
   for(let c=0;c<spot.cells;c++)reserved.add((spot.x+c)+","+spot.y);
 }
 snake.items=placed;snake.paused=true;snakeRender();
}

/* Random word locations and connected maze patterns every five correct words. */
let pacMazeStage=-1;

function pacRandomSpots(){let candidates=[];for(let y=0;y<5;y++)for(let x=1;x<=7;x++){if(PACW.has(x+','+y)||(Math.abs(x-4)+Math.abs(y-4)<2)||((x===1||x===7)&&y===2))continue;let blocked=false;for(let xx=x-1;xx<=x+1;xx++)if(PACW.has(xx+','+y))blocked=true;if(!blocked)candidates.push({x,y})}let picked=[];for(let c of sh(candidates)){if(picked.every(p=>Math.abs(p.y-c.y)>=2||Math.abs(p.x-c.x)>=3))picked.push(c);if(picked.length===3)return picked}return [{x:1,y:0},{x:4,y:0},{x:7,y:0}]}

/* Endless PAC: five words per maze level; one extra ghost every five completed levels. */
function makePacGhosts(){let count=2+Math.floor(pac.score/25),ghosts=[{x:0,y:2},{x:8,y:2}],spots=[];for(let y=0;y<5;y++)for(let x=0;x<9;x++)if(!PACW.has(x+','+y)&&Math.abs(x-4)+Math.abs(y-4)>=4&&!ghosts.some(g=>g.x===x&&g.y===y))spots.push({x,y});spots=sh(spots);for(let i=2;i<count;i++)ghosts.push({...spots[(i-2)%spots.length]});return ghosts}

function answerGap(value,selected){if(sentenceLocked)return;sentenceLocked=true;let current=sentenceRounds[sentenceIndex],ok=value===current[1];if(ok)sentenceCombo++;else sentenceCombo=0;let bonus=ok&&[3,5,10].includes(sentenceCombo)?1:0,points=ok?1+bonus:0;recordSentence(ok,value,points);if(bonus)playSound('combo');A.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===current[1])b.classList.add('correct');if(b===selected&&!ok)b.classList.add('wrong')});document.getElementById('fb').textContent=ok?'PERFECT! +'+points+(bonus?' · COMBO!':''):'NOT YET · '+current[1];document.getElementById('fb').className='feedback '+(ok?'good':'bad');later(()=>{sentenceIndex++;sentenceNext()},1300)}
function drawSentenceBuild(){let current=sentenceRounds[sentenceIndex];A.innerHTML=sentenceHead()+'<div class=panel><p class=sentenceMeta>Setze den ursprünglichen Satz aus Wortgruppen zusammen. Tippe einen gewählten Baustein an, um ihn zurückzulegen.</p><div id=sentenceBuild class="build sentenceBuild"></div><div id=sentencePool class=scramble></div><div class=actions><button id=sentenceCheck class=btn onclick=checkSentenceBuild()>PRÜFEN ✓</button><button class=btn onclick=resetSentenceBuild()>AUSWAHL LEEREN</button></div><div id=fb class=feedback aria-live=polite></div></div>';renderSentencePieces()}
function renderSentencePieces(){let current=sentenceRounds[sentenceIndex];let build=document.getElementById('sentenceBuild'),pool=document.getElementById('sentencePool');build.innerHTML=pool.innerHTML='';let order=sh(current[3].map((text,id)=>({text,id})));sentenceSelected.forEach(id=>{let b=document.createElement('button');b.className='piece sentencePiece';b.textContent=current[3][id];b.onclick=()=>{if(sentenceLocked)return;sentenceSelected=sentenceSelected.filter(i=>i!==id);renderSentencePieces()};build.appendChild(b)});order.filter(p=>!sentenceSelected.includes(p.id)).forEach(p=>{let b=document.createElement('button');b.className='piece sentencePiece';b.textContent=p.text;b.onclick=()=>{if(sentenceLocked)return;sentenceSelected.push(p.id);renderSentencePieces()};pool.appendChild(b)})}
function resetSentenceBuild(){if(sentenceLocked)return;sentenceSelected=[];renderSentencePieces()}
function checkSentenceBuild(){if(sentenceLocked)return;let current=sentenceRounds[sentenceIndex];if(sentenceSelected.length!==current[3].length){document.getElementById('fb').textContent='Bitte zuerst alle Wortgruppen einsetzen.';return}sentenceLocked=true;let ok=sentenceSelected.every((id,i)=>id===i),points=ok?4-sentenceAttempt:0;document.querySelectorAll('#sentenceBuild button').forEach((b,i)=>b.classList.add(sentenceSelected[i]===i?'correct':'wrong'));let f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');if(ok||sentenceAttempt===3){recordSentence(ok,sentenceSelected.map(id=>current[3][id]).join(' '),points);f.textContent=ok?'PERFECT! +'+points+' '+(points===1?'Punkt':'Punkte'):'NOT YET · '+current[0];later(()=>{sentenceIndex++;sentenceNext()},1600)}else{playSound('wrong');f.textContent='NOT YET · TRY AGAIN!';later(()=>{sentenceAttempt++;sentenceSelected=[];sentenceLocked=false;drawSentenceBuild()},1000)}}
const sentenceResults=renderRoundResults;renderRoundResults=function(){if(!['FILL THE GAP','BUILD THE SENTENCE'].includes(activeGame))return sentenceResults();return roundResults.map(r=>'<div class=resultRow>'+(r.ok?'✅ ':'❌ ')+escapeHTML(r.de)+(r.ok?'':'<div class=muted>Deine Antwort: '+escapeHTML(r.chosen)+'</div>')+'<div>Lernziel: <b>'+escapeHTML(r.correct)+'</b> · '+r.points+' Spielpunkte</div></div>').join('')};


const originalValid=valid;
function canonicalEntry(v){return norm(v).replace(/[.!?…]+$/g,'').replace(/\b(sb|sth)\./gi,'$1').replace(/\bsb\b/gi,'somebody').replace(/\bsth\b/gi,'something').replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim()}
valid=function(e,v){return originalValid(e,v)||canonicalEntry(e)===canonicalEntry(v)};
showCover=function(){stopGame();activeRestart=null;activeGame='';sessionStart=0;A.innerHTML='<div class=cover><button class=coverStart onclick="startSession()">▶ START GAME</button></div>';A.querySelector('.cover').prepend(document.getElementById('coverAsset').content.querySelector('img').cloneNode(true))};

showCover();
</script></body></html>
