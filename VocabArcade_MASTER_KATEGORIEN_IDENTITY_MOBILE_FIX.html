<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOCAB ARCADE</title>
<style>
:root{--bg:#090b17;--panel:#14182b;--panel2:#1c2240;--ink:#f8f8ff;--muted:#aeb6d9;--pink:#ff4fd8;--cyan:#4de8ff;--lime:#b8ff5a;--yellow:#ffd84d;--red:#ff6179;--violet:#8c72ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 15% 0,#2a174c 0,transparent 34%),radial-gradient(circle at 90% 15%,#073b50 0,transparent 30%),var(--bg);color:var(--ink)}
button,input{font:inherit}.app{max-width:1100px;margin:auto;padding:18px 18px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(#090b17e8,#090b1700)}
.logo{font-weight:1000;letter-spacing:.12em}.chip,.btn{border:1px solid #39405f;background:#202641;color:#fff;border-radius:15px;padding:11px 14px;font-weight:900}.btn{cursor:pointer}.btn:active,.card:active{transform:scale(.98)}
.hero{padding:28px 0 8px}.hero h1{font-size:clamp(48px,10vw,100px);line-height:.83;margin:12px 0;font-weight:1000;letter-spacing:-.055em}.hero h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 28px #4de8ff55}.sub{color:var(--muted);font-size:18px}
.progress{height:12px;border-radius:20px;background:#252b46;overflow:hidden;margin-top:16px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:20px}
.sectiontitle{margin:28px 0 12px;font-size:13px;letter-spacing:.15em;color:#cbd1ec;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;overflow:hidden;min-height:165px;padding:20px;border:1px solid #343b5b;border-radius:25px;background:linear-gradient(145deg,#1d2340,#111525);color:#fff;text-align:left;cursor:pointer;box-shadow:0 16px 50px #0004}.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-65px;background:var(--glow,#4de8ff);filter:blur(45px);opacity:.18}.ico{font-size:38px}.card b{display:block;font-size:25px;margin-top:10px}.card span{display:block;color:var(--muted);margin-top:7px}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1f;font-size:11px;font-weight:1000;letter-spacing:.08em}
.panel{margin-top:16px;padding:22px;border:1px solid #343b5b;border-radius:26px;background:#12172aee;box-shadow:0 18px 55px #0005}.question{text-align:center;font-size:clamp(28px,6vw,52px);font-weight:1000;margin:28px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{padding:18px;border:1px solid #3b4365;border-radius:17px;background:#202744;color:#fff;font-weight:900;min-height:70px}.answer:hover{border-color:var(--cyan)}
.feedback{text-align:center;min-height:38px;margin:16px;font-size:20px;font-weight:1000}.good{color:var(--lime)}.bad{color:var(--red)}.input{width:100%;padding:18px;border:1px solid #3b4365;border-radius:17px;background:#0d1120;color:white;text-align:center;font-size:23px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.key{width:44px;height:44px;border:0;border-radius:10px;background:#303957;color:white;font-weight:1000}.slots{text-align:center;font-size:28px;letter-spacing:.13em;font-weight:1000;margin:20px;word-break:break-word}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mem{min-height:88px;padding:7px;border:1px solid #3b4365;border-radius:14px;background:#242c4b;color:white;font-weight:850}.hidden{font-size:0}.hidden:after{content:"★";font-size:25px;color:var(--cyan)}.matched{background:#194739;border-color:#4fe0a0}
.score{font-size:72px;text-align:center;font-weight:1000}.combo{text-align:center;color:var(--yellow);font-weight:1000;min-height:24px}
.arena{position:relative;height:430px;border-radius:24px;overflow:hidden;background:linear-gradient(#101a36,#11162a 60%,#171d35);border:1px solid #3a4264;touch-action:none}.target{position:absolute;padding:12px 15px;border-radius:16px;background:#293353;border:2px solid #56648e;color:#fff;font-weight:1000;box-shadow:0 8px 22px #0006;user-select:none}.ship{position:absolute;bottom:12px;font-size:48px;transform:translateX(-50%);user-select:none}.basket{position:absolute;bottom:8px;width:92px;height:34px;border:4px solid var(--yellow);border-top:0;border-radius:0 0 25px 25px;transform:translateX(-50%)}.fall{position:absolute;padding:10px 13px;border-radius:14px;background:#293353;border:2px solid #59678e;font-weight:900;white-space:nowrap}
.hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:1000}.sentence{font-size:clamp(23px,5vw,38px);line-height:1.35;text-align:center;font-weight:850;margin:25px auto;max-width:850px}.blank{color:var(--cyan);border-bottom:3px solid var(--cyan);padding:0 8px}
.scramble{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px}.piece{padding:12px 14px;border-radius:14px;border:1px solid #485174;background:#262e4e;color:white;font-weight:850}.build{min-height:75px;padding:12px;border:2px dashed #455071;border-radius:17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#0e1324;border:1px solid #303856;border-radius:18px;padding:14px}.row{padding:7px 0;border-bottom:1px solid #29304a;font-size:13px}.row:last-child{border:0}.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:15px}.tab.on{border-color:var(--cyan);color:var(--cyan)}
.flash{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.05)}}@media(max-width:680px){.grid,.answers,.cols{grid-template-columns:1fr}.memory{grid-template-columns:repeat(4,1fr)}.mem{font-size:11px;min-height:72px}.arena{height:390px}.app{padding:12px}.hero h1{font-size:58px}}
</style></head>
<body><main class="app" id="app"></main>
<script>
const ALLV=[["identity","Identität","m","p1"],["sense of identity","Identitätsgefühl / Selbstverständnis","m","p1"],["personality","Persönlichkeit","m","p1"],["character trait","Charaktereigenschaft","m","p1"],["self-image","Selbstbild","m","p1"],["self-esteem","Selbstwertgefühl","m","p1"],["self-confidence","Selbstvertrauen","m","p1"],["values","Werte","m","p1"],["beliefs","Überzeugungen","m","p1"],["personal development","persönliche Entwicklung","m","p1"],["to find oneself","sich selbst finden","m","p1"],["to express oneself","sich ausdrücken","m","p1"],["to be true to oneself","sich selbst treu bleiben","m","p1"],["to shape one's identity","die eigene Identität prägen / formen","m","p1"],["background","Hintergrund","m","p2"],["upbringing","Erziehung / Aufwachsen","m","p2"],["to belong (to)","(zu etwas) gehören","m","p2"],["sense of belonging","Zugehörigkeitsgefühl","m","p2"],["to fit in","dazugehören / sich anpassen","m","p2"],["to stand out","auffallen / sich abheben","m","p2"],["peer group","Gruppe Gleichaltriger","m","p2"],["peer pressure","Gruppendruck","m","p2"],["expectations","Erwartungen","m","p2"],["role model","Vorbild","m","p2"],["acceptance","Akzeptanz","m","p2"],["rejection","Ablehnung","m","p2"],["to struggle with one's identity","mit der eigenen Identität ringen","m","p2"],["social identity","soziale Identität","m","p3"],["cultural identity","kulturelle Identität","m","p3"],["gender identity","Geschlechtsidentität","m","p3"],["heritage","kulturelles Erbe / Herkunft","m","p3"],["roots","Wurzeln / Herkunft","m","p3"],["community","Gemeinschaft","m","p3"],["diversity","Vielfalt","m","p3"],["multicultural society","multikulturelle Gesellschaft","m","p3"],["social norms","gesellschaftliche Normen","m","p3"],["stereotype","Stereotyp / Klischee","m","p3"],["prejudice","Vorurteil","m","p3"],["discrimination","Diskriminierung","m","p3"],["racism","Rassismus","m","p3"],["inclusion","Inklusion / Einbeziehung","m","p3"],["exclusion","Ausgrenzung","m","p3"],["equality","Gleichberechtigung / Gleichheit","m","p3"],["to judge somebody","jemanden beurteilen","m","p4"],["to discriminate against somebody","jemanden diskriminieren","m","p4"],["to face discrimination","Diskriminierung erfahren","m","p4"],["to challenge stereotypes","Stereotype infrage stellen","m","p4"],["to be accepted","akzeptiert werden","m","p4"],["to be rejected","abgelehnt werden","m","p4"],["to adapt (to)","sich (an etwas) anpassen","m","p4"],["to integrate","sich integrieren","m","p4"],["to influence somebody","jemanden beeinflussen","m","p4"],["to have an impact on","Auswirkungen auf etwas haben","m","p4"],["to feel torn between two cultures","sich zwischen zwei Kulturen hin- und hergerissen fühlen","m","p4"]];
let V=[...ALLV];
const SENT=[];
const A=document.getElementById("app"); let VS={},SS={}; try{VS=JSON.parse(localStorage.vocabArcadeV||"{}");SS=JSON.parse(localStorage.vocabArcadeS||"{}")}catch(e){}
function save(){try{localStorage.vocabArcadeV=JSON.stringify(VS);localStorage.vocabArcadeS=JSON.stringify(SS)}catch(e){}}
function sh(a){let b=[...a];for(let i=b.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function mix(n=10,p=V){let e=sh(p.filter(x=>x[2]=="e")).slice(0,4),m=sh(p.filter(x=>x[2]=="m")).slice(0,4),h=sh(p.filter(x=>x[2]=="h")).slice(0,2);let z=[...e,...m,...h];if(z.length<n)z=z.concat(sh(p.filter(x=>!z.includes(x))).slice(0,n-z.length));return sh(z)}
function recV(k,ok,w){VS[k]??={r:0,x:0,p:0};VS[k][ok?"r":"x"]++;VS[k].p+=ok?w:-w;save()}function recS(k,ok,w){SS[k]??={r:0,x:0,p:0};SS[k][ok?"r":"x"]++;SS[k].p+=ok?w:-w;save()}
function lvl(s){if(!s||s.r+s.x<2)return"practice";let r=s.r/(s.r+s.x);if(s.p>=4&&r>=.75)return"safe";if(s.x>=2&&r<.55)return"hard";return"practice"}
function head(t,p=""){return `<div class=top><button class=btn onclick="stopGame();menu()">⌂ MENU</button><b>${t}</b>${p=="FINISH"?`<span class=chip>✓ FERTIG</span>`:`<span class=chip>${p}</span>`}</div>`}

const BLOCKS=[
 {id:"p1",title:"Personal identity – Who am I?",sub:"14 Wörter"},
 {id:"p2",title:"Belonging & growing up",sub:"13 Wörter"},
 {id:"p3",title:"Social & cultural identity",sub:"16 Wörter"},
 {id:"p4",title:"Actions & experiences",sub:"11 Wörter"}
];
let selectedBlocks=new Set();

function chooseBlocks(){
 stopGame();
 A.innerHTML=`<div class=top><div class=logo>VOCAB ARCADE</div><span class=chip>IDENTITY</span></div>
 <section class=hero><h1>CHOOSE.<br><em>YOUR WORDS.</em></h1>
 <div class=sub>Wähle einen oder mehrere Vokabelblöcke.</div></section>
 <div class=grid id=blockGrid>${BLOCKS.map(b=>`<button type="button" class=card data-block="${b.id}" style="touch-action:manipulation" onclick="toggleBlock('${b.id}')"><div class=ico>📚</div><b>${b.title}</b><span>${b.sub}</span><small class=badge>SELECT</small></button>`).join("")}</div>
 <div class=actions style="margin-top:22px">
   <button type="button" class=btn style="touch-action:manipulation" onclick=selectAllBlocks()>ALLE</button>
   <button type="button" class=btn style="touch-action:manipulation" onclick=startSelectedBlocks()>START ✓</button>
 </div>
 <div id=blockMsg class=feedback style="text-align:center"></div>`;
 paintBlockSelection();
}
function toggleBlock(id){selectedBlocks.has(id)?selectedBlocks.delete(id):selectedBlocks.add(id);paintBlockSelection()}
function selectAllBlocks(){selectedBlocks=new Set(BLOCKS.map(b=>b.id));paintBlockSelection()}
function paintBlockSelection(){
 document.querySelectorAll("[data-block]").forEach(b=>{
   let on=selectedBlocks.has(b.dataset.block);
   b.style.outline=on?"3px solid #b8ff5a":"";
   b.style.transform=on?"translateY(-2px)":"";
   let badge=b.querySelector(".badge");if(badge)badge.textContent=on?"✓ SELECTED":"SELECT";
 });
 let m=document.getElementById("blockMsg");if(m)m.innerHTML=selectedBlocks.size?`<span class=good>${selectedBlocks.size} Block${selectedBlocks.size==1?"":"s"} gewählt · ${ALLV.filter(x=>selectedBlocks.has(x[3])).length} Wörter</span>`:"";
}
function startSelectedBlocks(){
 if(!selectedBlocks.size){let m=document.getElementById("blockMsg");if(m)m.innerHTML=`<span class=bad>Bitte mindestens einen Block auswählen.</span>`;return}
 V=ALLV.filter(x=>selectedBlocks.has(x[3]));menu();
}

function menu(){stopGame();let safe=V.filter(x=>lvl(VS[x[0]])=="safe").length;A.innerHTML=`<div class=top><div class=logo>VOCAB ARCADE</div><div style="display:flex;gap:8px;align-items:center"><button class=btn onclick=chooseBlocks()>⚙️ WORTAUSWAHL</button><span class=chip>⭐ ${safe}/${V.length} MASTERED</span></div></div><section class=hero><h1>PLAY.<br><em>LEVEL UP.</em></h1><div class=sub>8 Vokabelspiele · ${V.length} ausgewählte Wörter.</div><div class=progress><i style="width:${safe/V.length*100}%"></i></div></section>
<div class=sectiontitle>VOCAB GAMES</div><div class=grid>
${card("⚡","PICK IT!","Choose the right English word.","EASY","#b8ff5a","pickStart()")}
${card("⌨️","TYPE IT!","Type the English answer yourself.","CHALLENGE","#ff4fd8","typeStart()")}
${card("🛟","WORD RESCUE","Save the word letter by letter.","SPELL","#4de8ff","rescueStart()")}
${card("🧠","MEMORY","Match German and English.","MATCH","#8c72ff","memoryStart()")}
</div><div class=sectiontitle>ACTION GAMES</div><div class=grid>
${card("🚀","WORD BLASTER","Blast the correct English word.","ACTION","#ff6179","blasterStart()")}
${card("🧺","CATCH IT!","Catch the right word. Dodge the rest.","ACTION","#ffd84d","catchStart()")}
${card("🐍","VOCAB SNAKE","Steuere die Schlange zum richtigen Wort.","ACTION","#b8ff5a","snakeStart()")}
${card("👻","VOCAB PAC","Finde das richtige Wort und meide die Geister.","ACTION","#8c72ff","pacStart()")}
</div><div class=sectiontitle>SENTENCE GAMES</div><div class=grid>
<button class=card disabled style="opacity:.45;cursor:not-allowed"><div class=ico>🎯</div><b>SENTENCE CHALLENGE</b><span>Keine Beispielsätze im Lernblatt.</span><small class=badge>DISABLED</small></button>
<button class=card disabled style="opacity:.45;cursor:not-allowed"><div class=ico>🔀</div><b>SENTENCE SCRAMBLE</b><span>Keine Beispielsätze im Lernblatt.</span><small class=badge>DISABLED</small></button>
</div><div class=sectiontitle>YOUR TRAINING</div><div class=grid>
${card("📊","MY PROGRESS","Vocabulary and sentences separately.","STATS","#b8ff5a","report()")}
${card("🎯","TRAIN HARD WORDS","Focus on words not mastered yet.","FOCUS","#ffd84d","weak()")}
</div>`}
function card(i,t,s,b,g,fn){return `<button type="button" class=card style="--glow:${g};touch-action:manipulation;-webkit-tap-highlight-color:transparent" onclick="${fn}"><div class=ico>${i}</div><b>${t}</b><span>${s}</span><small class=badge>${b}</small></button>`}
let R=[],q=0,score=0,combo=0,timer=null,raf=null;let pickLog=[];
let pendingTimers=[];
function later(fn,ms){let id=setTimeout(()=>{pendingTimers=pendingTimers.filter(x=>x!==id);fn()},ms);pendingTimers.push(id);return id}
function stopGame(){if(timer){clearInterval(timer);clearTimeout(timer)}timer=null;if(raf)cancelAnimationFrame(raf);raf=null;pendingTimers.forEach(id=>clearTimeout(id));pendingTimers=[]}
function pickStart(p=V){R=mix(10,p);q=score=combo=0;pickLog=[];pickQ()}function pickQ(){if(q>=R.length)return pickEnd();let[e,d]=R[q],opts=sh([e,...sh(V.filter(x=>x[0]!=e)).slice(0,3).map(x=>x[0])]);A.innerHTML=head("⚡ PICK IT!",`${q+1}/${R.length}`)+`<div class=panel><div class=question>${d}</div><div class=answers>${opts.map(x=>`<button class=answer onclick='pickAns(${JSON.stringify(x)},${JSON.stringify(e)})'>${x}</button>`).join("")}</div><div id=fb class=feedback></div></div>`}
function pickAns(x,e){let ok=x==e;recV(e,ok,1);pickLog.push({de:R[q][1],correct:e,chosen:x,ok});if(ok){score++;combo++}else combo=0;document.querySelectorAll(".answer").forEach(b=>b.disabled=1);fb(ok,e);later(()=>{q++;pickQ()},800)}
function pickEnd(){stopGame();let rows=pickLog.map((r,i)=>`<div style="display:grid;grid-template-columns:32px 1fr 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #30395f"><div style="font-size:20px">${r.ok?"✅":"❌"}</div><div><b>${r.de}</b><div class=muted>${r.ok?"":"Deine Antwort: "+r.chosen}</div></div><div style="text-align:right"><b>${r.correct}</b></div></div>`).join("");A.innerHTML=head("⚡ PICK IT!","AUSWERTUNG")+`<div class=panel><div class=score>${score}/${R.length}</div><div class=combo>${score==R.length?"🏆 PERFECT RUN!":score>=R.length*.7?"🔥 NICE RUN!":"🎮 WEITER ÜBEN!"}</div><div style="margin-top:18px">${rows}</div><div class=actions><button class=btn onclick=pickStart()>↻ NOCHMAL</button><button class=btn onclick=menu()>⌂ MENU</button><button class=btn onclick=report()>📊 MY PROGRESS</button></div></div>`}
function typeStart(p=V){R=mix(10,p);q=score=combo=0;typeQ()}function typeQ(){if(q>=R.length)return end("TYPE IT!",score,R.length);let[e,d]=R[q];A.innerHTML=head("⌨️ TYPE IT!",`${q+1}/10`)+`<div class=panel><div class=question>${d}</div><input id=inp class=input autocorrect=off autocapitalize=off spellcheck=false placeholder="English …"><div class=actions><button class=btn onclick=typeCheck()>CHECK ✓</button></div><div id=fb class=feedback></div></div>`;inp.focus();inp.onkeydown=e=>{if(e.key=="Enter")typeCheck()}}
function norm(x){return x.trim().toLowerCase().replace(/[’´`]/g,"'").replace(/[.…]+$/g,"").replace(/\s+/g," ")}
function valid(expected,x){
 let a=norm(x),e=norm(expected);
 const variants={
  "stay: i stayed":["stay","i stayed","stayed"],
  "go: i went":["go","i went","went"],
  "read: i read":["read","i read"],
  "meet: i met":["meet","i met","met"],
  "get: i got":["get","i got","got"],
  "do: i did":["do","i did","did"],
  "have to do sth.":["have to do sth.","have to do sth","have to do something"],
  "find sth. out":["find sth. out","find sth out","find something out"],
  "put sth. in":["put sth. in","put sth in","put something in"],
  "be/feel homesick":["be homesick","feel homesick"],
  "they weren't …":["they weren't","they were not"],
  "we didn't have a …":["we didn't have a","we did not have a"],
  "i'd like to go home.":["i'd like to go home","i would like to go home"]
 };
 if(variants[e])return variants[e].map(norm).includes(a);
 return a==e
}
function typeCheck(){let e=R[q][0],ok=valid(e,inp.value);recV(e,ok,2);if(ok){score++;combo++}else combo=0;inp.disabled=1;fb(ok,e);later(()=>{q++;typeQ()},950)}
function fb(ok,e){document.getElementById("fb").innerHTML=ok?`<span class=good>PERFECT! +100 ${combo>1?"· "+combo+"× COMBO":""}</span>`:`<span class=bad>NOT YET · ${e}</span>`}
let target="",used=[],miss=0;function rescueStart(){R=sh(V.filter(x=>/^[a-zA-Z ]+$/.test(x[0]))).slice(0,8);q=score=0;rescueQ()}function rescueQ(){if(q>=R.length)return end("WORD RESCUE",score,R.length);target=R[q][0];used=[];miss=0;drawRescue()}
function drawRescue(){let sl=[...target].map(c=>c==" "?"&nbsp;&nbsp;":used.includes(c.toLowerCase())?c:"_").join(" ");A.innerHTML=head("🛟 WORD RESCUE",`${q+1}/${R.length}`)+`<div class=panel><div class=question>${R[q][1]}</div><div class=slots>${sl}</div><div class=feedback>${"❤️".repeat(Math.max(0,6-miss))}</div><div class=keys>${"abcdefghijklmnopqrstuvwxyz".split("").map(l=>`<button class=key ${used.includes(l)?"disabled":""} onclick="guess('${l}')">${l.toUpperCase()}</button>`).join("")}</div></div>`}
function guess(l){if(used.includes(l))return;used.push(l);if(!target.toLowerCase().includes(l))miss++;let win=[...target.toLowerCase()].filter(c=>/[a-z]/.test(c)).every(c=>used.includes(c));if(win||miss>=6){drawRescue();recV(target,win,1);if(win)score++;let f=document.querySelector(".panel .feedback");if(f)f.innerHTML=win?`<span class=good>SAVED! · ${target}</span>`:`<span class=bad>Solution: ${target}</span>`;document.querySelectorAll(".key").forEach(b=>b.disabled=true);later(()=>{q++;rescueQ()},1100)}else drawRescue()}
let M=[],first=null,lock=false,matched=0;function memoryStart(){let p=mix(8);M=sh(p.flatMap(([e,d],k)=>[{x:e,k,e},{x:d,k,e}]));first=null;lock=false;matched=0;memoryDraw()}function memoryDraw(){A.innerHTML=head("🧠 MEMORY",`${matched}/8`)+`<div class=panel><div class=memory>${M.map((c,i)=>`<button id=m${i} class="mem hidden" onclick=flip(${i})>${c.x}</button>`).join("")}</div></div>`}
function flip(i){if(lock)return;let b=document.getElementById("m"+i);if(!b.classList.contains("hidden"))return;b.classList.remove("hidden");if(first===null){first=i;return}if(M[first].k==M[i].k){b.classList.add("matched");document.getElementById("m"+first).classList.add("matched");recV(M[i].e,true,.75);matched++;first=null;if(matched==8)later(()=>end("MEMORY",8,8),400)}else{lock=true;recV(M[i].e,false,.25);let z=first;later(()=>{document.getElementById("m"+z)?.classList.add("hidden");document.getElementById("m"+i)?.classList.add("hidden");first=null;lock=false},600)}}

function report(){stopGame();let vg={safe:[],practice:[],hard:[]};V.forEach(x=>vg[lvl(VS[x[0]])].push(x));A.innerHTML=head("📊 MY PROGRESS","")+`<div class=panel><h2>VOCABULARY · ${V.length} SELECTED WORDS</h2>${stat(vg,x=>`<b>${x[0]}</b><br><span class=muted>${x[1]}</span>`)}<div class=actions><button class=btn onclick=weak()>🎯 TRAIN HARD WORDS</button><button class=btn onclick=chooseBlocks()>⚙️ WORTAUSWAHL</button><button class=btn onclick=resetAll()>RESET PROGRESS</button></div></div>`}
function stat(g,render){let box=(k,t,e)=>`<div class=box><h3>${e} ${t} · ${g[k].length}</h3>${g[k].length?g[k].map(x=>`<div class=row>${render(x)}</div>`).join(""):`<span class=muted>None yet.</span>`}</div>`;return `<div class=cols>${box("safe","SAFE","🟢")}${box("practice","PRACTISE","🟡")}${box("hard","HARD","🔴")}</div>`}
function weak(){let p=V.filter(x=>lvl(VS[x[0]])=="hard");if(!p.length){A.innerHTML=head("🎯 TRAIN HARD WORDS","")+`<div class=panel style="text-align:center"><div class=question>NO HARD WORDS YET! 🎉</div><div class=muted style="margin:12px 0 18px">Spiel erst ein paar Runden. Wörter, die dir wirklich schwerfallen, landen automatisch hier.</div><div class=actions><button class=btn onclick=menu()>⌂ MENU</button><button class=btn onclick=report()>📊 MY PROGRESS</button></div></div>`;return}typeStart(p)}function resetAll(){if(confirm("Reset all learning progress?")){VS={};SS={};save();report()}}
chooseBlocks();
</script></body></html>
